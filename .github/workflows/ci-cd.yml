name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (vet + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy (runner self-hosted)
    needs: [backend, frontend]
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["self-hosted","linux","calculadora-graham"]') }}
    environment:
      name: deployment
      url: ${{ vars.APP_URL || '' }}
    concurrency:
      group: deploy-calculadora-graham
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deploy com Docker Compose
        env:
          SHA: ${{ github.sha }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          COMPOSE_PROJECT_NAME: calculadora-graham
          BRAPI_API_KEY: ${{ secrets.BRAPI_API_KEY }}
          BRAPI_URL: ${{ secrets.BRAPI_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: bash .github/scripts/deploy.sh
